{% extends 'base.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
<section class="login">
  <h1>Sign in</h1>

  <form method="post" class="login-form">
    {{ csrf_field() | safe if csrf_field is defined }}

    <label>
      <span>Email</span>
      <input type="email" name="email" required placeholder="you@example.com">
    </label>

    <label>
      <span>Password</span>
      <input type="password" name="password" required placeholder="••••••••">
    </label>

    <div class="form-actions">
      <a class="btn ghost" href="{{ url_for('auth.register') }}">Create account</a>
      <button type="submit" class="btn primary submit">Sign in</button>
    </div>
  </form>
</section>
{% endblock %}
