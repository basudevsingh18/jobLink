[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:gunicorn]
directory=/app
command=/usr/local/bin/gunicorn -w 2 -k gthread -b 0.0.0.0:%(ENV_PORT)s "%(ENV_GUNICORN_APP)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/gunicorn.stdout.log
stderr_logfile=/var/log/supervisor/gunicorn.stderr.log
environment=PYTHONUNBUFFERED="1"

[program:postgrest]
; postgrest reads DB config from env (PGRST_DB_URI, etc.)
command=/usr/local/bin/postgrest
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgrest.stdout.log
stderr_logfile=/var/log/supervisor/postgrest.stderr.log
